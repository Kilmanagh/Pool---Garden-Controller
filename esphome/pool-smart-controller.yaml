esphome:
  name: pool-smart-controller
  friendly_name: Pool Controller
  comment: Local pool and garden controller
  project:
    name: kilmanagh.pool_garden_controller
    version: "0.2.0"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(boot_count) += 1;
          id(wifi_connected_state) = false;
          id(api_client_count) = 0;
      - binary_sensor.template.publish:
          id: wifi_connected
          state: OFF
      - binary_sensor.template.publish:
          id: api_connected
          state: OFF
      - binary_sensor.template.publish:
          id: autofill_timeout_status
          state: OFF
      - binary_sensor.template.publish:
          id: autofill_flow_fault_status
          state: OFF
      - text_sensor.template.publish:
          id: valve_1_last_stop_reason
          state: "booting"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

globals:
  - id: boot_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: wifi_connected_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wifi_disconnect_count
    type: int
    restore_value: yes
    initial_value: '0'
  - id: api_client_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: api_disconnect_count
    type: int
    restore_value: yes
    initial_value: '0'

logger:

api:
  on_client_connected:
    then:
      - lambda: |-
          id(api_client_count) += 1;
      - binary_sensor.template.publish:
          id: api_connected
          state: ON
  on_client_disconnected:
    then:
      - lambda: |-
          if (id(api_client_count) > 0) {
            id(api_client_count) -= 1;
          }
          id(api_disconnect_count) += 1;
      - binary_sensor.template.publish:
          id: api_connected
          state: !lambda 'return id(api_client_count) > 0;'

ota:
  - platform: esphome

web_server:
  port: 80

debug:
  update_interval: 30s

# --- PART 1: LOCAL-ONLY NETWORK CREDENTIALS ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  on_connect:
    then:
      - lambda: |-
          id(wifi_connected_state) = true;
      - binary_sensor.template.publish:
          id: wifi_connected
          state: ON
  on_disconnect:
    then:
      - lambda: |-
          id(wifi_connected_state) = false;
          id(wifi_disconnect_count) += 1;
      - binary_sensor.template.publish:
          id: wifi_connected
          state: OFF

  manual_ip:
    static_ip: 10.7.0.2
    gateway: 10.7.0.2
    subnet: 255.0.0.0

  ap:
    ssid: "Pool-Controller-Fallback"
    password: !secret fallback_ap_password

captive_portal:

# --- PART 2: TIME COMPONENT FOR MIDNIGHT RESET ---
# Syncs local time from Home Assistant to wipe out the daily total at midnight
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - pulse_meter.set_total_pulses:
              id: autofill_flow_rate
              value: 0

# --- PART 3: HARDWARE DRIVERS & INPUT SLIDERS ---
one_wire:
  - platform: gpio
    pin: GPIO4

number:
  # Slider to adjust the Auto Fill maximum run duration
  - platform: template
    name: "Auto Fill Max Run Time"
    id: autofill_timeout_setting
    icon: "mdi:clock-end"
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 20
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true

  # Grace period before declaring a no-flow fault after opening the autofill valve
  - platform: template
    name: "Auto Fill Flow Start Delay"
    id: autofill_flow_start_delay_setting
    icon: "mdi:timer-play-outline"
    min_value: 5
    max_value: 120
    step: 1
    initial_value: 20
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true

  # Minimum measured flow that counts as a valid autofill run
  - platform: template
    name: "Auto Fill Minimum Flow Rate"
    id: autofill_min_flow_rate_setting
    icon: "mdi:water-check"
    min_value: 0.1
    max_value: 10
    step: 0.1
    initial_value: 0.2
    unit_of_measurement: "GPM"
    optimistic: true
    restore_value: true

  # Slider to adjust the Freeze Warning temperature trigger
  - platform: template
    name: "Freeze Warning Threshold"
    id: freeze_threshold_setting
    icon: "mdi:thermometer-snowflake"
    min_value: 30
    max_value: 45
    step: 1
    initial_value: 34
    unit_of_measurement: "°F"
    optimistic: true
    restore_value: true

script:
  - id: valve_1_timeout_guard
    mode: restart
    then:
      - delay: !lambda |-
          const float timeout_minutes = id(autofill_timeout_setting).state;
          const float bounded_timeout_minutes = timeout_minutes < 1.0f ? 1.0f : timeout_minutes;
          return (uint32_t) (bounded_timeout_minutes * 60000.0f);
      - if:
          condition:
            switch.is_on: valve_1
          then:
            - binary_sensor.template.publish:
                id: autofill_timeout_status
                state: ON
            - text_sensor.template.publish:
                id: valve_1_last_stop_reason
                state: "timeout"
            - switch.turn_off: valve_1
            - logger.log: "Safety Protocol: Valve 1 run time exceeded limit. Automatically shut off."

  - id: valve_1_flow_guard
    mode: restart
    then:
      - delay: !lambda |-
          const float start_delay_seconds = id(autofill_flow_start_delay_setting).state;
          const float bounded_start_delay_seconds = start_delay_seconds < 1.0f ? 1.0f : start_delay_seconds;
          return (uint32_t) (bounded_start_delay_seconds * 1000.0f);
      - if:
          condition:
            lambda: |-
              if (!id(valve_1).state) {
                return false;
              }
              if (!id(autofill_flow_rate).has_state()) {
                return true;
              }
              return id(autofill_flow_rate).state < id(autofill_min_flow_rate_setting).state;
          then:
            - binary_sensor.template.publish:
                id: autofill_flow_fault_status
                state: ON
            - text_sensor.template.publish:
                id: valve_1_last_stop_reason
                state: "flow_fault"
            - switch.turn_off: valve_1
            - logger.log: "Safety Protocol: Valve 1 detected insufficient flow. Automatically shut off."

# --- PART 4: TEMPERATURE, TELEMETRY & WATER FLOW ENGINE ---
sensor:
  # Sensor 1: Physical Pool Water Probe
  - platform: dallas_temp
    address: 0xaa000000127b0928
    name: "Pool Water Temperature"
    id: pool_water_temp
    icon: "mdi:coolant-temperature"
    update_interval: 30s
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (x <= -100.0f) {
            return {};
          }
          if (x >= 84.0f && x <= 86.0f) {
            return {};
          }
          return x * 1.8f + 32.0f;

  # Sensor 2: Physical Ambient Air Probe
  - platform: dallas_temp
    address: 0x3e000000156d5d28
    name: "Pool Equipment Ambient Temperature"
    id: ambient_air_temp
    update_interval: 30s
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (x <= -100.0f) {
            return {};
          }
          if (x >= 84.0f && x <= 86.0f) {
            return {};
          }
          return x * 1.8f + 32.0f;
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return id(ambient_air_temp).state <= id(freeze_threshold_setting).state;
            then:
              - binary_sensor.template.publish:
                  id: freeze_warning_status
                  state: ON
            else:
              - binary_sensor.template.publish:
                  id: freeze_warning_status
                  state: OFF

  # Sensor 3: DN20 3/4 NPT brass hall-effect water flow sensor input (GPIO27 via divider)
  - platform: pulse_meter
    pin:
      number: GPIO27
      mode:
        input: true
    name: "Water Flow Rate"
    id: autofill_flow_rate
    timeout: 10s
    filters:
      - multiply: 0.00004
    unit_of_measurement: "GPM"
    accuracy_decimals: 1
    total:
      name: "Daily Water Total"
      id: daily_water_total
      unit_of_measurement: "gal"
      accuracy_decimals: 2
      icon: "mdi:water-pump"
      state_class: total_increasing
      filters:
        - multiply: 0.00004

  # Diagnostic 5: Tracks Wi-Fi Signal Strength in Decibels (dBm)
  - platform: wifi_signal
    name: "Pool Controller Wi-Fi Signal"
    id: wifi_rssi_db
    update_interval: 60s

  # Diagnostic 6: Monitors how long the board has been powered on
  - platform: uptime
    name: "Pool Controller Uptime"
    id: system_uptime_s
    update_interval: 5min

  # Diagnostic 7: Tracks the real-time heat of the ESP32 processor silicon
  - platform: internal_temperature
    name: "Pool Controller Internal Chip Temp"
    id: internal_chip_temp
    unit_of_measurement: "°F"
    update_interval: 60s
    filters:
      - lambda: return x * 1.8 + 32.0;

  - platform: debug
    free:
      name: "Pool Controller Heap Free"
      id: heap_free_bytes
      unit_of_measurement: "B"
      entity_category: diagnostic
    fragmentation:
      name: "Pool Controller Heap Fragmentation"
      id: heap_fragmentation_pct
      unit_of_measurement: "%"
      entity_category: diagnostic
    loop_time:
      name: "Pool Controller Main Loop Time"
      id: main_loop_time_ms
      unit_of_measurement: "ms"
      entity_category: diagnostic

  - platform: template
    name: "Pool Controller Boot Count"
    id: boot_count_sensor
    icon: "mdi:counter"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return (float) id(boot_count);

  - platform: template
    name: "Pool Controller Wi-Fi Disconnect Count"
    id: wifi_disconnect_count_sensor
    icon: "mdi:wifi-alert"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return (float) id(wifi_disconnect_count);

  - platform: template
    name: "Pool Controller API Client Count"
    id: api_client_count_sensor
    icon: "mdi:lan-connect"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return (float) id(api_client_count);

  - platform: template
    name: "Pool Controller API Disconnect Count"
    id: api_disconnect_count_sensor
    icon: "mdi:lan-disconnect"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      return (float) id(api_disconnect_count);

# --- PART 5: SYSTEM STATUS & TELEMETRY ---
binary_sensor:
  - platform: status
    name: "Pool Controller Status"
    id: controller_status

  - platform: template
    name: "Pool Controller Wi-Fi Connected"
    id: wifi_connected
    entity_category: diagnostic

  - platform: template
    name: "Pool Controller API Connected"
    id: api_connected
    entity_category: diagnostic

  - platform: template
    name: "Pool Equipment Freeze Warning"
    id: freeze_warning_status
    device_class: cold
    icon: "mdi:snowflake-alert"

  - platform: template
    name: "Pool Controller Self-Test Ready"
    id: controller_self_test_ready
    entity_category: diagnostic
    lambda: |-
      return id(pool_water_temp).has_state()
          && id(ambient_air_temp).has_state();

  - platform: template
    name: "Pool Auto Fill Flow Monitor Ready"
    id: autofill_flow_monitor_ready
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(autofill_flow_rate).has_state();

  - platform: template
    name: "Pool Auto Fill Timeout Tripped"
    id: autofill_timeout_status
    device_class: problem
    icon: "mdi:timer-alert"

  - platform: template
    name: "Pool Auto Fill Flow Fault"
    id: autofill_flow_fault_status
    device_class: problem
    icon: "mdi:water-alert"

  - platform: template
    name: "Pool Controller Memory Warning"
    id: memory_warning
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      if (!isnan(id(heap_free_bytes).state) && id(heap_free_bytes).state < 20000.0f) {
        return true;
      }
      if (!isnan(id(heap_fragmentation_pct).state) && id(heap_fragmentation_pct).state > 50.0f) {
        return true;
      }
      return false;

text_sensor:
  - platform: version
    name: "Pool Controller ESPHome Version"

  - platform: debug
    reset_reason:
      name: "Pool Controller Reset Reason"
      id: reset_reason_text
      entity_category: diagnostic

  - platform: template
    name: "Pool Controller Self-Test Detail"
    id: controller_self_test_detail
    icon: "mdi:clipboard-text-clock-outline"
    update_interval: 5s
    lambda: |-
      if (!id(pool_water_temp).has_state()) {
        return {"pool_probe_not_ready"};
      }
      if (!id(ambient_air_temp).has_state()) {
        return {"ambient_probe_not_ready"};
      }
      if (!id(autofill_flow_rate).has_state()) {
        return {"ready_without_flow_sensor"};
      }
      return {"ready"};

  - platform: template
    name: "Pool Valve 1 Status"
    id: valve_1_status
    icon: "mdi:valve"
    update_interval: 5s
    lambda: |-
      if (id(valve_1).state) {
        return {"running"};
      }
      if (!id(controller_self_test_ready).state) {
        return {"blocked"};
      }
      return {"idle"};

  - platform: template
    name: "Garden Valve 2 Status"
    id: valve_2_status
    icon: "mdi:valve"
    update_interval: 5s
    lambda: |-
      if (id(valve_2).state) {
        return {"running"};
      }
      if (!id(controller_self_test_ready).state) {
        return {"blocked"};
      }
      return {"idle"};

  - platform: template
    name: "Garden Valve 3 Status"
    id: valve_3_status
    icon: "mdi:valve"
    update_interval: 5s
    lambda: |-
      if (id(valve_3).state) {
        return {"running"};
      }
      if (!id(controller_self_test_ready).state) {
        return {"blocked"};
      }
      return {"idle"};

  - platform: template
    name: "Garden Valve 4 Status"
    id: valve_4_status
    icon: "mdi:valve"
    update_interval: 5s
    lambda: |-
      if (id(valve_4).state) {
        return {"running"};
      }
      if (!id(controller_self_test_ready).state) {
        return {"blocked"};
      }
      return {"idle"};

  - platform: template
    name: "Pool Controller Device Health"
    id: device_health
    icon: "mdi:heart-pulse"
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      if (id(system_uptime_s).state < 60.0f) {
        return {"Recovering After Boot"};
      }
      if (!id(controller_status).state) {
        return {"Controller Offline"};
      }
      if (!id(wifi_connected_state)) {
        return {"WiFi Reconnecting"};
      }
      if (id(api_client_count) <= 0) {
        return {"WiFi OK / API Idle"};
      }
      if (!id(controller_self_test_ready).state) {
        return {"Sensor Trouble"};
      }
      if (id(memory_warning).state) {
        return {"Memory Warning"};
      }
      return {"Healthy"};

  - platform: template
    name: "Pool Valve 1 Last Stop Reason"
    id: valve_1_last_stop_reason
    icon: "mdi:message-alert-outline"
    update_interval: never

  - platform: wifi_info
    ip_address:
      name: "Pool Controller IP Address"
    ssid:
      name: "Pool Controller Wi-Fi SSID"

button:
  - platform: restart
    name: "Pool Controller Restart"

# --- PART 6: THE 4 ACTIVE VALVE SWITCHES ---
switch:
  - platform: gpio
    pin: GPIO16
    name: "Pool Valve 1"
    id: valve_1
    inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - if:
            condition:
              binary_sensor.is_on: controller_self_test_ready
            then:
              - binary_sensor.template.publish:
                  id: autofill_timeout_status
                  state: OFF
              - binary_sensor.template.publish:
                  id: autofill_flow_fault_status
                  state: OFF
              - text_sensor.template.publish:
                  id: valve_1_last_stop_reason
                  state: "running"
              - script.execute: valve_1_timeout_guard
              - if:
                  condition:
                    binary_sensor.is_on: autofill_flow_monitor_ready
                  then:
                    - script.execute: valve_1_flow_guard
                  else:
                    - logger.log: "Safety Protocol: Valve 1 running without flow monitoring because the flow sensor is not ready."
            else:
              - text_sensor.template.publish:
                  id: valve_1_last_stop_reason
                  state: "self_test_blocked"
              - switch.turn_off: valve_1
              - logger.log: "Safety Protocol: Valve 1 start blocked because controller self-test is not ready."
    on_turn_off:
      then:
        - script.stop: valve_1_timeout_guard
        - script.stop: valve_1_flow_guard
        - if:
            condition:
              lambda: |-
                return !id(autofill_timeout_status).state && !id(autofill_flow_fault_status).state;
            then:
              - text_sensor.template.publish:
                  id: valve_1_last_stop_reason
                  state: "manual_off"

  - platform: gpio
    pin: GPIO17
    name: "Garden Valve 2"
    id: valve_2
    inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - if:
            condition:
              binary_sensor.is_off: controller_self_test_ready
            then:
              - switch.turn_off: valve_2
              - logger.log: "Safety Protocol: Garden Valve 2 start blocked because controller self-test is not ready."

  - platform: gpio
    pin: GPIO18
    name: "Garden Valve 3"
    id: valve_3
    inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - if:
            condition:
              binary_sensor.is_off: controller_self_test_ready
            then:
              - switch.turn_off: valve_3
              - logger.log: "Safety Protocol: Garden Valve 3 start blocked because controller self-test is not ready."

  - platform: gpio
    pin: GPIO19
    name: "Garden Valve 4"
    id: valve_4
    inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - if:
            condition:
              binary_sensor.is_off: controller_self_test_ready
            then:
              - switch.turn_off: valve_4
              - logger.log: "Safety Protocol: Garden Valve 4 start blocked because controller self-test is not ready."